name: Generate Dynamic Resume PDF
on:
  push:
    paths:
      - 'index.html'
      - 'style.css'
    branches:
      - main
      - feature/**

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Google Chrome Stable
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Generate Dynamic Vector ATS Resume PDF
        run: |
          chmod +x generate-pdf.sh
          ./generate-pdf.sh

      - name: Commit & push updated PDF (if modified)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Sri_Hruday_Preetham_Perika_Java_Full_Stack_2026.pdf
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(pdf): auto-update resume PDF from index.html" && git push)
